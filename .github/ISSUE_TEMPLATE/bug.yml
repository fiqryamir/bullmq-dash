name: Bug report
description: Report something broken in bullmq-dash
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps or a minimal example to trigger it.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: bullmq-dash package + version, BullMQ version, Redis version, Node version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should have happened instead?
